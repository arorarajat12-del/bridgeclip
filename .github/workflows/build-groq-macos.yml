name: Build BridgeClip Groq for macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BRIDGECLIP_DISABLE_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install media build dependencies
        run: brew install pkg-config libass nasm
      - name: Install app dependencies
        run: npm ci
      - name: Check source
        run: |
          npm run typecheck
          npm run lint
          npm run test:renderer
      - name: Prepare bundled macOS runtime
        run: bash scripts/prepare-resources.sh arm64
      - name: Build macOS installer
        run: |
          npm run build
          npx electron-builder --mac --arm64 --publish never --config electron-builder.groq-mac.yml
          codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/BridgeClip Groq.app"
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: BridgeClip-Groq-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
