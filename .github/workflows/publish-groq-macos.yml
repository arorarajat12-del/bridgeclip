name: Publish BridgeClip Groq macOS installers

on:
  workflow_run:
    workflows: [Build BridgeClip Groq for macOS]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS build run ID
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: BridgeClip-Groq-macOS-arm64
          path: installers
          merge-multiple: true
      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh installers/*.dmg
          tag=groq-macos-0.1.18-2
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" installers/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" installers/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title 'BridgeClip Groq for macOS (ARM64)' \
              --notes 'BridgeClip with a separate Groq API key option. Ad-hoc signed macOS 15 installer for Apple silicon Macs. This build is not Apple notarized; macOS may require Open Anyway in Privacy & Security.'
          fi
